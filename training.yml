# Developer Accessibility Learning Pathway
# Drives the Training left nav, the /training/ overview page, and lesson prev/next links.
# A lesson with a `slug` has a page at /training/<slug>/. A lesson with `status: coming-soon`
# is listed but not linked yet. A lesson with `url` links to an existing site page.

intro: >-
  The Developer Accessibility Learning Pathway is a progressive sequence of short, focused
  trainings that build practical accessibility skills across MNIT DOT development teams.
  Each lesson is a condensed version of our full sessions, aligned with WCAG, MNIT standards,
  and DOT testing practices. Work through the sections in order, or jump to the topic you need.

sections:
  - id: foundations
    title: Accessibility Foundations
    description: >-
      The essential concepts developers must understand before applying accessibility techniques
      in code: WCAG principles, semantic structure, ARIA usage, and accessible form patterns.
    lessons:
      - slug: accessibility-foundations
        title: Accessibility Foundations
      - slug: html-accessibility-fundamentals
        title: HTML Accessibility Fundamentals
      - slug: aria-fundamentals
        title: ARIA Fundamentals
      - slug: forms-and-error-messages
        title: Forms & Error Messages

  - id: core-testing
    title: Accessibility Testing
    description: >-
      Developers must be able to test their own work before handing it to QA. These lessons cover
      the core testing techniques used across DOT so you can identify issues early and reduce
      remediation cycles.
    lessons:
      - slug: keyboard-testing
        title: Keyboard Testing
      - slug: color-alone-and-contrast
        title: Color Alone & Color Contrast
      - slug: zoom-and-magnification
        title: Zoom & Magnification
      - slug: text-spacing
        title: Text Spacing
      - slug: axe-devtools-basics
        title: Axe DevTools Basics
      - slug: nvda-basics
        title: NVDA Basics

  - id: language-specific
    title: Language-Specific Accessibility Integration
    description: >-
      Different stacks require different techniques. These lessons focus on integrating
      accessibility metadata, error messaging, and keyboard operability into the technologies
      used across MNIT DOT.
    lessons:
      - slug: csharp-accessibility-integration
        title: C# Accessibility Integration
      - title: Angular Accessibility Integration
        status: coming-soon
      - slug: java-accessibility-integration
        title: Java Accessibility Integration

  - id: patterns
    title: Technology-Agnostic Accessibility Patterns
    description: >-
      Reusable patterns that apply across all technologies. These form the foundation of the
      Accessibility Pattern Playbook and help developers build consistent, predictable
      components regardless of framework.
    lessons:
      - slug: accessible-component-patterns
        title: Accessible Component Patterns
      - slug: error-messaging-and-focus-patterns
        title: Error Messaging & Focus Interaction Patterns

  - id: workflow
    title: Developer Workflow Integration
    description: >-
      Accessibility must be embedded into the development lifecycle, not treated as an
      afterthought. These lessons show how accessibility fits into the SDLC, code review, and
      your team's day-to-day workflow.
    lessons:
      - slug: accessibility-in-sdlc
        title: Accessibility in SDLC
      - slug: accessibility-in-code-review
        title: Accessibility in Code Review
      - title: Accessibility in GitHub Workflows
        status: coming-soon
      - title: Developer Accessibility Checklist
        url: /code-review-checklist/
        note: Reference page

  - id: advanced
    title: Optional Advanced Training
    description: >-
      Deeper coverage of complex topics. Optional, but recommended for developers working with
      data-heavy interfaces, dashboards, or applications that rely on structured content.
    lessons:
      - title: Accessible Tables & Data Grids
        status: coming-soon
      - title: Accessible Charts & Data Visualization
        status: coming-soon
