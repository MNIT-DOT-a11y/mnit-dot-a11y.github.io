# Accessibility Learning Pathways hub (/training/) — the 4 role-based pathways.
# Drives training/index.html and _includes/training-pathways-nav.html.
# A pathway with a `url` is built and linked; one without is listed as coming soon.

intro:
  - >-
    Accessibility Learning Pathways offer short, role-based learning to help you build practical
    accessibility skills for your everyday work. Each pathway includes 5&ndash;10 micro-learning
    topics, typically 10&ndash;45 minutes each, with skills you can apply right away.
  - >-
    Whether you are new to MNIT, moving into a new role, or continuing to build your knowledge,
    these pathways can help. They support accessibility throughout the digital service
    lifecycle&mdash;from planning and design through development, testing, procurement, and
    maintenance.
  - >-
    Each pathway is tailored to the responsibilities of specific roles and is grounded in digital
    accessibility and WCAG 2.1 Level AA.

pathways:
  - name: Developers
    description: >-
      Build practical skills for creating accessible applications, identifying accessibility
      issues in code and interfaces, testing their work, and resolving defects before release.
    url: /training/developers/

  - name: Managers and supervisors
    description: >-
      Learn how to establish clear accessibility expectations, ask informed questions, understand
      roles and evidence, and make risk-based decisions that support accessible outcomes.

  - name: Project managers and business analysts
    description: >-
      Develop a common language and consistent practices for communicating accessibility
      requirements, coordinating responsibilities, and carrying accessibility needs from planning
      through build and testing.

  - name: Quality analysts
    description: >-
      Strengthen your ability to test digital products for accessibility, document meaningful
      findings, communicate defects clearly, and verify that issues have been resolved.
