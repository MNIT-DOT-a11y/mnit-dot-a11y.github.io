# QA pathway knowledge-check questions, keyed by lesson slug.
# answer = 0-based index into options. 3 questions per lesson.
# Rendered by _layouts/qa-training-knowledge-check.html on /training/qa/<slug>/knowledge-check/.
accessibility-foundations:
  title: Accessibility Foundations
  questions:
  - q: What does the “O” in POUR stand for?
    options:
    - Organized
    - Operable
    - Optional
    - Observable
    answer: 1
    explain: Operable means users must be able to interact using a keyboard, mouse, touch, or assistive
      technology.
  - q: Which standard do we test against?
    options:
    - Section 508 only
    - ISO 9001
    - WCAG (Web Content Accessibility Guidelines)
    - The browser's default settings
    answer: 2
    explain: WCAG defines the criteria QA tests against and the requirements developers must meet.
  - q: What is QA's role in accessibility?
    options:
    - Fix accessibility defects in the code
    - Verify accessibility through manual and automated testing
    - Approve design mockups
    - Only run automated scans before release
    answer: 1
    explain: Developers build accessible components; QA verifies accessibility with both manual and automated
      testing.
keyboard-testing:
  title: Keyboard Testing
  questions:
  - q: Which key combination moves focus backward through interactive elements?
    options:
    - Escape
    - Shift + Tab
    - Ctrl + Tab
    - Backspace
    answer: 1
    explain: Tab moves forward and Shift + Tab moves backward. Arrow keys navigate within components like
      menus and radio groups.
  - q: When a modal dialog opens, what should happen to keyboard focus?
    options:
    - It stays on the button that opened the modal
    - It moves into the modal, cycles inside it, and returns to the trigger when closed
    - It moves to the top of the page
    - It moves to the browser address bar
    answer: 1
    explain: Focus should move into the modal, Tab should cycle within it, Escape should close it, and
      focus should return to the trigger.
  - q: How do you test for a keyboard trap?
    options:
    - Click every element with the mouse
    - Tab into the component, then try Tab, Shift+Tab, and Escape to leave it
    - Run an automated scan only
    - Check the component's CSS
    answer: 1
    explain: If none of Tab, Shift+Tab, or Escape lets you leave, the component contains a trap, which
      is a serious failure.
color-alone-testing:
  title: Color Alone Testing
  questions:
  - q: A form marks required fields only by turning the label red. What is the result?
    options:
    - Pass, because red is a standard color for required fields
    - Fail, because color is the only indicator of meaning
    - Pass, as long as the red meets contrast
    - It only matters on mobile
    answer: 1
    explain: Color can support meaning but cannot be the only source. Add text such as “required” or a
      visible indicator with a text equivalent.
  - q: Which chart passes a color-alone check?
    options:
    - Categories shown only by different colors
    - Categories with direct data labels, patterns, or distinct shapes plus a text legend
    - A chart with brighter colors
    - A chart with a color-coded tooltip
    answer: 1
    explain: Labels, patterns, shapes, and clear text legends let users interpret data without distinguishing
      colors.
  - q: What is the correct way to show a form error?
    options:
    - A red border only
    - A red border, an error icon, and a descriptive error message
    - A red background on the page
    - Changing the submit button to red
    answer: 1
    explain: Users must understand what went wrong and how to fix it, so color must be paired with text.
color-contrast-testing:
  title: Color Contrast Testing
  questions:
  - q: What is the minimum contrast ratio for standard body text?
    options:
    - 3 to 1
    - 4.5 to 1
    - 7 to 1
    - 2 to 1
    answer: 1
    explain: Standard text needs at least 4.5:1. Large text (18 pt regular or 14 pt bold) needs at least
      3:1.
  - q: Which elements must meet the 3 to 1 non-text contrast requirement?
    options:
    - Only decorative images
    - Icons, focus indicators, interactive controls, and input borders
    - Only body text
    - Page background images
    answer: 1
    explain: WCAG 1.4.11 requires 3:1 for graphical objects and user interface components so users can
      identify controls.
  - q: How do you measure contrast with the Color Contrast Analyzer?
    options:
    - Guess by looking at the screen
    - Use the eyedropper to pick the foreground and background colors, then review the ratio against WCAG
    - Run the page through a spell checker
    - Zoom to 400 percent
    answer: 1
    explain: Select the foreground and background with the eyedropper, then confirm the ratio meets the
      WCAG requirement.
zoom-and-magnification-testing:
  title: Zoom & Magnification Testing
  questions:
  - q: What is the key difference between browser zoom and screen magnification?
    options:
    - There is no difference
    - Browser zoom reflows content; magnification enlarges pixels and requires panning
    - Magnification only works on mobile
    - Browser zoom only enlarges images
    answer: 1
    explain: Browser zoom triggers layout reflow. Magnifiers enlarge pixels, so only part of the screen
      is visible and users must pan.
  - q: At 400 percent browser zoom, what should the layout look like?
    options:
    - Exactly the same as 100 percent, just larger
    - A single-column layout with readable text, reachable controls, and no horizontal scrolling
    - A layout that requires horizontal scrolling to read each line
    - A mobile app download prompt
    answer: 1
    explain: Reflow (1.4.10) expects content to stack into a single column without horizontal scrolling
      at 400 percent.
  - q: Which issue is Windows Magnifier more likely to reveal than browser zoom?
    options:
    - Misspelled words
    - Hover-only interactions that disappear and sticky headers that cover most of the view
    - Missing page titles
    - Incorrect heading levels
    answer: 1
    explain: Magnification reveals real-world usability issues such as disappearing hover content, dominating
      sticky headers, and excessive panning.
text-spacing-bookmarklet-testing:
  title: Text Spacing Bookmarklet Testing
  questions:
  - q: Which set of values does the Text Spacing Bookmarklet apply?
    options:
    - Line height 2, letter spacing 1, word spacing 1
    - Line height 1.5, paragraph spacing 2, letter spacing 0.12, word spacing 0.16 (times the font size)
    - Font size 200 percent
    - Line height 1, no other changes
    answer: 1
    explain: These are the WCAG 1.4.12 minimum spacing values content must support.
  - q: After applying the bookmarklet, button text is cut off inside a fixed-height button. What is the
      result?
    options:
    - Pass, because the button still exists
    - Fail, because text is clipped and content is lost
    - Pass, if the button meets contrast
    - Not applicable to buttons
    answer: 1
    explain: Content must remain readable and functional. Clipped text caused by fixed heights or overflow
      hidden is a failure.
  - q: When testing a form with increased text spacing, what should you check?
    options:
    - Only the page title
    - Labels wrap correctly, inputs expand, error messages stay visible, and legends stay readable
    - Only the submit button color
    - Nothing, forms are exempt
    answer: 1
    explain: Forms often break under increased spacing, so labels, inputs, errors, fieldsets, and legends
      must all remain usable.
nvda-basics:
  title: NVDA Basics
  questions:
  - q: What should NVDA announce when you Tab to a control?
    options:
    - Only the page title
    - The element's role, accessible name, and state or value
    - The element's CSS class
    - Nothing until you press Enter
    answer: 1
    explain: Listen for the role, the accessible name, the state or value, and position in a set. Missing
      or wrong information is a defect.
  - q: Which NVDA command opens the elements list?
    options:
    - Ctrl + Home
    - Insert + F7
    - Alt + Tab
    - Shift + H
    answer: 1
    explain: Insert+F7 opens the elements list, where you can review the page's headings, links, and landmarks
      together.
  - q: Why is NVDA testing needed if Axe DevTools already scanned the page?
    options:
    - It isn't needed
    - Automated scans can't hear what users hear; NVDA reveals announcement, focus, and semantic issues
      a scan misses
    - NVDA is faster than Axe
    - Axe only works in Firefox
    answer: 1
    explain: Automated tools catch only part of the problems. A real screen reader shows whether content
      is announced correctly.
nvda-page-structure-testing:
  title: NVDA Page Structure Testing
  questions:
  - q: While pressing H, NVDA jumps from an H1 straight to an H4. What does that indicate?
    options:
    - Nothing, heading levels don't matter
    - Skipped heading levels, which break the page's logical outline
    - The page is missing images
    - A contrast failure
    answer: 1
    explain: Headings should follow a logical order without skipping levels so users understand the hierarchy
      (WCAG 1.3.1 and 2.4.6).
  - q: A clickable element that submits a form is announced by NVDA as “clickable, Submit” rather than
      “Submit, button”. What is the likely cause?
    options:
    - NVDA is out of date
    - It is built from a div or span instead of a native button
    - The button is too small
    - The page has no H1
    answer: 1
    explain: Native buttons announce their role. Div and span elements used as controls lose that semantic
      meaning.
  - q: In the elements list, several links read “Click here”. What is the finding?
    options:
    - Pass, because the links work
    - Fail, because link text isn't descriptive out of context (WCAG 2.4.4)
    - Only a best practice with no WCAG criterion
    - A color contrast issue
    answer: 1
    explain: Link text should describe its purpose, for example “View Report” rather than “Click here”.
nvda-forms-and-error-messages-testing:
  title: NVDA Forms & Error Messages Testing
  questions:
  - q: NVDA announces a field only as “edit text” with no name. What is the most likely defect?
    options:
    - The field is too narrow
    - The field has no programmatically associated label (it may rely on a placeholder)
    - The page has too many headings
    - The font is too small
    answer: 1
    explain: Every field needs a label associated with it, for example with label for and id. Placeholders
      disappear and aren't announced consistently.
  - q: After submitting a form with errors, where should keyboard focus go?
    options:
    - To the top of the page
    - To the first field with an error
    - To the submit button
    - It should not move
    answer: 1
    explain: Moving focus to the first error helps keyboard and screen reader users find the problem immediately.
  - q: Which error message would pass your review?
    options:
    - “Invalid input.”
    - “Error.”
    - “Enter a valid email format, such as name@example.com.”
    - A red border with no text
    answer: 2
    explain: Effective messages identify the field, describe the issue, and explain what the user must
      do.
axe-devtools-basics:
  title: Axe DevTools Basics
  questions:
  - q: Roughly what share of accessibility issues do automated tools like Axe catch?
    options:
    - 100 percent
    - About 30 to 40 percent
    - About 90 percent
    - Less than 5 percent
    answer: 1
    explain: Automated tools find a meaningful share of issues, but manual testing is required for the
      rest.
  - q: What does the “Needs Review” category mean?
    options:
    - The issue is confirmed and must be fixed
    - Axe couldn't decide automatically, so a person must check it
    - The rule is a best practice only
    - The page failed to load
    answer: 1
    explain: Needs Review items require human judgment before they are confirmed as defects.
  - q: What should a QA defect based on an Axe finding include?
    options:
    - Only a screenshot
    - The violation name, WCAG reference, affected element, and steps to reproduce
    - Only the page URL
    - The developer's name
    answer: 1
    explain: Clear defects with the rule, WCAG criterion, element, and steps let developers reproduce
      and fix the issue.
accessibility-in-qa-workflow:
  title: Accessibility in QA Workflow
  questions:
  - q: Why is it important to find accessibility defects early?
    options:
    - Late defects are cheaper
    - Late defects are costly and often require design or architecture changes
    - It doesn't matter when they're found
    - Early testing replaces QA
    answer: 1
    explain: Embedding accessibility throughout the SDLC reduces rework and shortens remediation cycles.
  - q: Which checks belong in the QA and UAT phase?
    options:
    - Only a visual review
    - Manual keyboard, screen reader, and magnification checks alongside automated results
    - None, accessibility is handled in design
    - Only performance testing
    answer: 1
    explain: QA and UAT include manual keyboard, NVDA, and magnification checks in addition to automated
      scans.
  - q: What is a reasonable accessibility release criterion?
    options:
    - No release criteria are needed
    - A passing accessibility checklist and no high-severity findings before production
    - Zero warnings of any kind
    - Only a passing spell check
    answer: 1
    explain: Release criteria should require a passing checklist and no high-severity accessibility findings
      before deploy.
