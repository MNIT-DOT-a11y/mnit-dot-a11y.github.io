# Managers and Supervisors Accessibility Learning Pathway
# Drives the left nav (_includes/managers-training-nav.html), /training/managers/, and lesson pagers.
# A lesson with a `slug` has a page at /training/managers/<slug>/. `status: coming-soon` lists it unlinked.
# A lesson with `external_url` links to an external course sign-up.
# Content source: Kim Lanahan-Lahti, "Manager-Supervisor GitHub Content" (2026-10-13).

intro:
  - >-
    The Manager and Supervisors Accessibility Learning Pathway offers a series of concise, targeted
    training sessions to build strong accessibility knowledge. This pathway complements the Developer,
    QA, Project Manager, and Business Analyst pathways. While those pathways teach staff how to do
    accessible work, this one teaches managers and supervisors how to create the conditions for that
    work to happen: staffing, planning, resourcing, and accountability.

sections:
  - id: foundations
    title: "Accessibility Foundations"
    description: >-
      Learn how accessibility policies, legal obligations, and WCAG 2.1 Level AA standards inform
      accessibility practices. Understand how digital accessibility strengthens public trust, improves
      quality, and reduces organizational risk.
    lessons:
      - slug: why-accessibility-matters
        title: "Why Accessibility Matters: Legal, Ethical & Business Case"
      - title: "Why Accessibility Matters: Inclusion, Quality, and Risk"
        status: coming-soon
      - slug: wcag-pour-principles
        title: "WCAG 2.1 AA in Plain Language: The POUR Principles"

  - id: lead-people
    title: "Lead Your People"
    description: >-
      Understand how accessibility duties are distributed across roles and build accessibility
      standards into hiring and team practices. Employ practical leadership actions to cultivate an
      accessibility-first mindset that improves quality and minimizes organizational risks.
    lessons:
      - title: "Accessibility Is a Team Sport: Roles and Responsibilities"
        status: coming-soon
      - title: "Embedding Accessibility into Job Descriptions & Hiring"
        status: coming-soon
      - title: "Build an Accessibility-First Team Culture"
        status: coming-soon

  - id: lead-processes
    title: "Lead Your Processes"
    description: >-
      Learn how to plan accessibility efforts, establish procurement and vendor expectations, and
      understand testing tools and their results. Use evidence and user impact to prioritize fixes,
      enhance quality, and lower organizational risk.
    lessons:
      - title: "Plan Capacity, Time, and Risk for Accessibility"
        status: coming-soon
      - title: "Make Informed Vendor Accessibility Decisions"
        status: coming-soon
      - title: "Accessibility Testing and Remediation Priorities: What Leaders Need to Know"
        status: coming-soon

  - id: lead-communications
    title: "Lead Your Communications"
    description: >-
      Learn to create accessible documents and verify their accessibility. Complete only the courses
      relevant to your regular work: Word for creating or editing documents, Excel for working with
      spreadsheets, PowerPoint for developing presentations, and PDF for saving and sharing PDF files.
    note: >-
      These courses are offered separately through the MnDOT Accessibility Training Program.
      Visit <a href="https://mn365.sharepoint.com/sites/DOT_A11y/_layouts/15/Events.aspx?ListGuid=83f2d464-e48b-4627-b790-64a47637c0d8&AudienceTarget=false">MnDOT's Digital Accessibility Program Training SharePoint</a>
      to sign up for the courses you need.
    lessons:
      - title: "Accessible Word"
        external_url: "https://mn365.sharepoint.com/sites/DOT_A11y/_layouts/15/Events.aspx?ListGuid=83f2d464-e48b-4627-b790-64a47637c0d8&AudienceTarget=false"
        note: "Sign up on SharePoint"
      - title: "Accessible PowerPoint"
        external_url: "https://mn365.sharepoint.com/sites/DOT_A11y/_layouts/15/Events.aspx?ListGuid=83f2d464-e48b-4627-b790-64a47637c0d8&AudienceTarget=false"
        note: "Sign up on SharePoint"
      - title: "Accessible Excel"
        external_url: "https://mn365.sharepoint.com/sites/DOT_A11y/_layouts/15/Events.aspx?ListGuid=83f2d464-e48b-4627-b790-64a47637c0d8&AudienceTarget=false"
        note: "Sign up on SharePoint"
      - title: "Accessible PDFs"
        external_url: "https://mn365.sharepoint.com/sites/DOT_A11y/_layouts/15/Events.aspx?ListGuid=83f2d464-e48b-4627-b790-64a47637c0d8&AudienceTarget=false"
        note: "Sign up on SharePoint"

  - id: sustain-lead
    title: "Sustain & Lead"
    description: >-
      Understand how to handle accessibility risks, evaluate trade-offs, and identify when to seek
      help from accessibility experts. Establish clear escalation procedures to enable informed
      decision-making and minimize organizational risks.
    lessons:
      - title: "Manage Accessibility Risk, Trade-offs, and Escalations"
        status: coming-soon
      - title: "Escalation Pathways: When and How to Loop in Accessibility Specialists"
        status: coming-soon
